<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8" />
    <title>PriceHub Live Feed</title>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            direction: rtl;
            background: #f4f6f8;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #0078d7;
            margin-bottom: 20px;
        }

        #status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 10px;
        }

        th {
            background: #0078d7;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>

<body>
    <h2>📊 Real-Time Token Prices</h2>
    <div id="status">🔄 Connecting...</div>

    <table id="prices">
        <thead>
            <tr>
                <th>Token</th>
                <th>Network</th>
                <th>Price (USD)</th>
                <th>Last Updated (UTC)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const hubUrl = "https://autoapi.rzprime.com/hubs/NotifyInventories";

        const connection = new signalR.HubConnectionBuilder()
            .withUrl(hubUrl, {
                headers: {
                    "applicationId": "test",
                    "signature": "test"
                }
            })
            .configureLogging(signalR.LogLevel.Information)
            .build();

        const statusEl = document.getElementById("status");
        const tbody = document.querySelector("#prices tbody");

        function setStatus(text, color = "#0078d7") {
            statusEl.textContent = text;
            statusEl.style.color = color;
        }

        connection.on("NotifyInventory", (priceStorage) => {
            tbody.innerHTML = "";

            for (const [tokenName, info] of Object.entries(priceStorage)) {
                const p = info.price;
                const last = new Date(info.lastUpdated).toLocaleString();

                const row = document.createElement("tr");
                row.innerHTML = `
          <td>${p.tokenName}</td>
          <td>${p.tokenNetwork}</td>
          <td>${p.price.toFixed(6)}</td>
          <td>${last}</td>
        `;
                tbody.appendChild(row);
            }
        });

        async function start() {
            try {
                setStatus("🔄 Connecting...");
                await connection.start();
                setStatus("✅ Connected");
                console.log("✅ Connected to PriceHub");
            } catch (err) {
                console.error("❌ Connection failed:", err);
                setStatus("❌ Connection failed — retrying in 5s", "red");
                setTimeout(start, 5000);
            }
        }

        connection.onclose(() => {
            setStatus("⚠️ Disconnected — reconnecting...", "orange");
            start();
        });

        start();
    </script>
</body>

</html>
